<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETD Croatia</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; padding:24px 16px;
         background:radial-gradient(circle at 30% 20%, #1e293b, var(--bg) 70%);
         color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center; }
  h1 { font-size:clamp(2.2rem,8vw,4rem); letter-spacing:-0.02em; }
  .bar { width:64px; height:4px; background:var(--accent); border-radius:2px; margin:20px auto; }
  p { color:var(--muted); font-size:1.1rem; line-height:1.6; }
  footer { margin-top:40px; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>ETD Croatia</h1>
    <div class="bar"></div>
    <p>Uskoro. · Coming soon.</p>
    <footer>&copy; <span id="y">2026</span> ETD Croatia</footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
